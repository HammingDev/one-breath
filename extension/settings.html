<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>一息 · 偏好设置</title><link rel="stylesheet" href="ui.css"></head><body><header><span class="brand"><i class="mark" aria-hidden="true"></i>一息 <small>ONE BREATH</small></span><span class="quiet">本地保存</span></header><main class="settings"><div class="eyebrow">偏好设置</div><h1>按自己的节奏。</h1><p class="intro">设置每次浏览的时长，以及结束后的休息间隔。</p><form id="form"><div class="field"><div><label for="visit">单次浏览时长 · 分钟</label><p>切换标签页或软件，时间仍继续流逝。</p></div><input id="visit" type="number" min="1" max="120" step="1" required></div><div class="field"><div><label for="cooldown">结束后的冷却间隔 · 分钟</label><p>从本次浏览结束时起算。</p></div><input id="cooldown" type="number" min="1" max="1440" step="1" required></div><div class="field"><div><label for="exercise">打开前的小休息</label><p>练习结束后，由你选择是否继续。</p></div><select id="exercise"><option value="breath">自然呼吸 · 12 秒</option><option value="eyes">眼睛休息 · 20 秒</option></select></div><p class="note">更改将用于下一次新会话。正在进行的浏览和冷却保持原来的截止时间。关闭最后一个推特标签页，或点击“结束浏览”，会立即开始冷却。</p><div class="actions"><button class="primary" type="submit">保存偏好</button><span id="saved" class="detail success" role="status"></span></div><p id="error" class="error" role="alert"></p></form><p class="detail">保护范围：同一 Chrome 身份的全部窗口，包含 x.com 与 twitter.com。无需登录、无数据上传。不作用于其他浏览器、其他身份或无痕窗口。</p></main><script type="module" src="settings.js"></script></body></html>
